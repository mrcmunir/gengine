name: CI BUILD gengine

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  APP_VERSION: 0.5.1
  CONFIGURATION: RelWithDebInfo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ==================== Linux ====================
      - name: Install FFmpeg build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm yasm

      - name: Cache static FFmpeg (Linux)
        if: runner.os == 'Linux'
        id: cache-ffmpeg
        uses: actions/cache@v5
        with:
          path: Libraries/ffmpeg/build
          key: ffmpeg-static-${{ runner.os }}-${{ matrix.arch }}-v3

      - name: Build static FFmpeg (Linux)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          chmod +x build_ffmpeg_static.sh
          ./build_ffmpeg_static.sh

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install \
            libsdl2-dev \
            libglew-dev \
            libpng-dev \
            libgl1-mesa-dev

      # ==================== macOS ====================
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config sdl2 glew libpng zlib
          brew install ffmpeg@4
          brew link --force --overwrite ffmpeg@4

      # ==================== Windows ====================
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 17 2022" -A Win32

      # ==================== Configure (Linux) ====================
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.CONFIGURATION }}

      # ==================== Configure (macOS) ====================
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.CONFIGURATION }} -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      # ==================== Build deploy ====================
      - name: Build deploy (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --target deploy --config ${{ env.CONFIGURATION }}

      - name: Build deploy (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --target deploy --config %CONFIGURATION%
        shell: cmd

      # ==================== Portable packaging for Linux ====================
      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf

      - name: Make Linux package portable
        if: runner.os == 'Linux'
        run: |
          set -e
          DEPLOY_DIR="Bin/${{ env.CONFIGURATION }}"
          BINARY="$DEPLOY_DIR/gk3"
          echo "=== Binary info ==="
          ls -la "$DEPLOY_DIR"
          file "$BINARY"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found"
            exit 1
          fi
          echo "=== Copying essential shared libraries ==="
          for lib in libSDL2-2.0.so.0 libGLEW.so.2.2 libpng16.so.16; do
            found=$(ldconfig -p | grep -F "$lib" | head -1 | awk '{print $NF}')
            if [ -n "$found" ] && [ -f "$found" ]; then
              echo "Copying $found"
              cp -L "$found" "$DEPLOY_DIR/"
            else
              echo "WARNING: $lib not found"
            fi
          done
          echo "=== Copying FMOD ==="
          case "${{ matrix.arch }}" in
            x86_64) FMOD_ARCH="x86_64" ;;
            arm64) FMOD_ARCH="aarch64" ;;
            *) echo "Unsupported arch: ${{ matrix.arch }}"; exit 1 ;;
          esac
          cp -L "Libraries/fmod/lib/linux/$FMOD_ARCH/libfmod.so.14.12" "$DEPLOY_DIR/libfmod.so.14"
          echo "=== Adjusting binary ==="
          patchelf --replace-needed libfmod.so libfmod.so.14 "$BINARY"
          patchelf --set-rpath '$ORIGIN' "$BINARY"
          echo "=== Final ldd check ==="
          ldd "$BINARY" | grep "not found" && exit 1
          echo "=== Overwriting zip in place ==="
          ZIP_NAME=$(ls "$DEPLOY_DIR"/GK3-Linux-*.zip | head -1 | xargs basename)
          cd "$DEPLOY_DIR"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" .
          cd -
          echo "=== Done ==="

      # ==================== Upload artifacts ====================
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Game-${{ runner.os }}-${{ matrix.arch }}
          path: Bin/${{ env.CONFIGURATION }}/GK3-*.zip

  # ==================== Create GitHub Release ====================
  upload-release:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare unique filenames
        run: |
          mkdir -p release_files
          find artifacts -name "GK3-*.zip" -type f | while read file; do
            parent_dir=$(basename "$(dirname "$file")")
            new_name="release_files/$(basename "$file" .zip)-$parent_dir.zip"
            cp "$file" "$new_name"
            echo "Copied: $file -> $new_name"
          done
          echo "=== Files ready for release ==="
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
